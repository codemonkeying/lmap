# lmap source catalog. One [source.<id>] per dataset.
# Paths are relative to the data root (--root / LMAP_ROOT / config root=). Layout:
#   data/australia/             national data (elevation, OSM, GA maps, australia.qgz)
#   data/australia/queensland/  one folder per state: its statewide files + <state>.qgz
#   data/moon/                  the Moon
#   areas/<country>/<state>/NAME, maps/<country>/<state>/NAME   lmap area create / lmap map output (self-contained)
#   apps/                       phone app data (OsmAnd)
# out  = the finished file in the data root. Tiled downloads land in the local tile cache (config tiles=, default
#        <tmp>/lmap-UID/tiles/<dest>) and are deleted once `out` is built; a re-run resumes from the cache.
# xml  = tile-server definition, relative to the lmap tool (share/).
# template = true: not stored; area create fetches it for an area's extent.
# kind: copernicus | tcc-aerial | url | wms-tiles | s2-worldcover | osm-clip | arcgis | qld-tides | manual | build-input (read by a project build, not fetched alone)
# Server notes (outages, quirks): see SERVER NOTES at the end of this file.

[source.dem-au-90m]
title   = "Copernicus DEM 90m, all of Australia"
kind    = "copernicus"
res     = 90                     # 90 -> COG_30 bucket, 30 -> COG_10 bucket
lat     = [10, 44]               # degrees SOUTH, inclusive
lon     = [112, 154]             # degrees EAST, inclusive
dest    = "dem-au-90m"
out     = "data/australia/dem-90m.cog.tif"
licence = "Copernicus DEM licence (free, attribution: (c) DLR e.V. 2010-2014 and (c) Airbus 2014-2018, provided under COPERNICUS by the EU and ESA)"
home    = "https://registry.opendata.aws/copernicus-dem/"
est_gb  = 3

[source.dem-au-30m]
title   = "Copernicus DEM 30m, all of Australia"
kind    = "copernicus"
res     = 30
lat     = [9, 44]                # degrees SOUTH, inclusive
lon     = [112, 154]             # degrees EAST, inclusive
dest    = "dem-au-30m"
out     = "data/australia/dem-30m.cog.tif"
max_conns = 160                  # far bucket: speed comes from many connections (see SERVERS slots in lmaplib/00_base.py)
licence = "Copernicus DEM licence (see dem-au-90m)"
home    = "https://registry.opendata.aws/copernicus-dem/"
est_gb  = 25

[source.dem-se-aus-30m]
title   = "Copernicus DEM 30m, SE Australia"
kind    = "copernicus"
res     = 30
lat     = [34, 44]
lon     = [140, 150]
dest    = "dem-se-aus-30m"
out     = "data/australia/dem-SE-30m.cog.tif"
licence = "Copernicus DEM licence (see dem-au-90m)"
home    = "https://registry.opendata.aws/copernicus-dem/"
est_gb  = 2.6

[source.dem-qld-30m]
title   = "Copernicus DEM 30m, all of QLD"
kind    = "copernicus"
res     = 30
lat     = [9, 29]
lon     = [137, 153]
dest    = "dem-qld-30m"
out     = "data/australia/queensland/dem-30m.cog.tif"
licence = "Copernicus DEM licence (see dem-au-90m)"
home    = "https://registry.opendata.aws/copernicus-dem/"
est_gb  = 7

[source.aerial-tsv-2019]
title   = "Townsville City Council aerial 2019 (10cm source, stored resampled)"
kind    = "tcc-aerial"
year    = 2019
out_res = 0.5                    # metres per pixel stored on disk
dest    = "aerial-tsv-2019"
out     = "data/australia/queensland/aerial-townsville-2019-50cm.cog.tif"
licence = "CC BY 4.0 - attribute Townsville City Council"
home    = "https://dashboards.townsville.qld.gov.au/aerialphotography"
est_gb  = 4                      # at 0.5 m; source download is ~394 GB

[source.osm-water]
title   = "OSM water polygons (sea), clipped to Australia (osmdata.openstreetmap.de; sea fill on topo prints)"
kind    = "vector-zip"
urls    = ["https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip"]
shp     = "water-polygons-split-4326/water_polygons.shp"
layer   = "sea"
bbox    = [112, -44.5, 154.5, -9]  # the zip is the whole world (~0.9 GB); keep Australia only
dest    = "data/australia/osm-water-polygons.gpkg"
licence = "ODbL 1.0 - (c) OpenStreetMap contributors"
home    = "https://osmdata.openstreetmap.de/data/water-polygons.html"
est_gb  = 0.3

[source.osm-au]
title   = "OpenStreetMap, all of Australia (Geofabrik .osm.pbf)"
kind    = "url"
urls    = ["https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf"]
dest    = "data/australia/osm"
licence = "ODbL 1.0 - (c) OpenStreetMap contributors"
home    = "https://download.geofabrik.de/australia-oceania.html"
est_gb  = 1

[source.osm-australia]
title   = "OSM all Australia: places, roads, waterways, indexed (fast in QGIS; used by australia.qgz and areas)"
kind    = "osm-clip"
from    = "data/australia/osm/australia-latest.osm.pbf"
dest    = "data/australia/osm/osm-australia.gpkg"
indexes = ["roads(highway)", "places(place)"]
licence = "ODbL 1.0 - (c) OpenStreetMap contributors"
home    = "https://www.openstreetmap.org/copyright"
est_gb  = 1.6

[source.osm-australia.layers.places]
from   = "points"
where  = "place IN ('city','town','village','suburb','hamlet','locality')"
select = "name,place"

[source.osm-australia.layers.roads]
from   = "lines"
where  = "highway IS NOT NULL"
select = "name,highway"

[source.osm-australia.layers.waterways]
from   = "lines"
where  = "waterway IN ('river','stream','canal')"
select = "name,waterway"

[source.osmand-au]
title   = "OsmAnd offline maps, all 8 states/territories (phone app)"
kind    = "url"
base    = "https://download.osmand.net/download?standard=yes&file="
files   = [
  "Australia-oceania_australian-capital-territory_australia-oceania_2.obf.zip",
  "Australia-oceania_new-south-wales_australia-oceania_2.obf.zip",
  "Australia-oceania_northern-territory_australia-oceania_2.obf.zip",
  "Australia-oceania_queensland_australia-oceania_2.obf.zip",
  "Australia-oceania_south-australia_australia-oceania_2.obf.zip",
  "Australia-oceania_tasmania_australia-oceania_2.obf.zip",
  "Australia-oceania_victoria_australia-oceania_2.obf.zip",
  "Australia-oceania_western-australia_australia-oceania_2.obf.zip",
]
dest    = "apps/osmand"
licence = "ODbL 1.0 - (c) OpenStreetMap contributors"
home    = "https://osmand.net/list"
est_gb  = 1.5

[source.ga-ref-maps]
title   = "Geoscience Australia general reference maps (A3 1:15M, A4 1:20M PDFs)"
kind    = "manual"
dest    = "data/australia/reference-maps"
