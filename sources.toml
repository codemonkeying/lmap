# SERVER NOTES - known quirks. Comments only; lmap ignores them.
#
# spatial-img.information.qld.gov.au (QLD Basemaps ImageServer: aerial-tsv-latest, sat-qld-2m4)
#   Quirk: LatestStateProgram is a MOSAIC of separate capture projects (Townsville 2019-22
#     SISP flights + Planet 2017 fill): hard colour/season seams on sheets. Re-fetching won't fix it. Newer flights
#     (e.g. Townsville_LGA_2025_20cm, listed in Imagery/ImageryFootprint) are not public until ~3 years after
#     capture. Seamless alternative: Basemaps/LatestSatelliteWOS_AllUsers = Planet 2017 Q3 only, 2.4 m (softer, older).
#   Outages happen (the Basemaps folder lists no services; tiles answer 404/empty). lmap refuses an all-empty
#     result ("no imagery at all ... likely a server outage"). Check: curl the Basemaps ?f=json listing;
#     healthy = it names LatestStateProgram_AllUsers.
#   Quirk: answers ~1.0 s per tile when loaded (normal ~0.05 s); lmap drops connections 64 -> 48 itself.

