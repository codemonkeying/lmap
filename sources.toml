# ---- QLD LiDAR for the AU 3D view (built by `lmap au project`, not fetched on its own: kind = "build-input")
# Measured 2026-10-16: the ImageServer's exportImage renders on demand (~30-80 s / 2048 px, 502/504 under load);
# its elevation CACHE (/tile/z/y/x) is pre-built: 257x257 px LERC (1 px overlap), ~45 KB, 0.1 s, z<=18 (0.6 m),
# 16 connections ~135 tiles/s with no errors (4: 12/s + 502s; 32: no faster). Same heights as exportImage
# (median 0.035 m). GDAL reads LERC as Byte unless told DATATYPE=Float32. Outside flown projects the cache is
# 30 m SRTM fill, so only tiles over the coverage polygons are used.
[source.lidar-qld]
title     = "QLD LiDAR DEM (QldDem elevation cache), over the AU 3D view's box where flown"
kind      = "build-input"
url       = "https://spatial-img.information.qld.gov.au/arcgis/rest/services/Elevation/QldDem/ImageServer/tile/${z}/${y}/${x}"
coverage  = "https://spatial-gis.information.qld.gov.au/arcgis/rest/services/Elevation/ElevationProjectExtents/MapServer/200/query"
cov_days  = 30                 # re-ask for new LiDAR projects this often
max_zoom  = 18                 # 0.597 m; z19 is 404
tile_px   = 257                # LERC tiles carry 1 px overlap with the next tile
unit      = 16                 # tiles per side per work unit (one GeoTIFF each). z17: 32 -> 239k tiles, 16 -> 183k,
                               # 8 -> 156k (fewer wasted outside coverage, but 2442 files): 16 is the balance
conns     = 16                 # start: 16 measured fastest (135 tiles/s); the host's 64 is for its aerial cache
max_conns = 16                 # 32 was no faster on this cache (16 ~135 tiles/s): cap here; TileGate backs off on errors
dest      = "data/australia/lidar"
licence   = "CC BY 4.0 - State of Queensland"
home      = "https://spatial-img.information.qld.gov.au/arcgis/rest/services/Elevation/QldDem/ImageServer"

